<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <defs>
    <style>
      .body { fill: #3a3a3a; stroke: #5a5a5a; stroke-width: 1.5; }
      .key  { fill: none; stroke: #8aa0ff; stroke-width: 2; stroke-linejoin: round; }
      .on   { stroke: #4fa4ff; }
      .wheel-bg { stroke: #5a5a5a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- 鼠标主体 -->
  <rect x="4" y="4" width="28" height="24" rx="6" class="body"/>

  <!-- 左键区域 -->
  <path d="M6 6 h12 v20 h-12 z" class="key"/>

  <!-- 右键区域 -->
  <path d="M18 6 h12 v20 h-12 z" class="key"/>

  <!-- 分割线 -->
  <line x1="18" y1="6" x2="18" y2="26" stroke="#5a5a5a" stroke-width="1.5"/>

  <!-- 旁边小滚轮条 -->
  <line x1="38" y1="6" x2="38" y2="26" class="wheel-bg"/>
  <!-- 可高亮的滚轮方向箭头（默认灰，可运行时替换 stroke 为高亮色） -->
  <polygon points="38,8 35,12 41,12" fill="#5a5a5a" id="wheel_up"/>
  <polygon points="38,24 35,20 41,20" fill="#5a5a5a" id="wheel_down"/>

  <!-- 左右按下可在运行时把相应 path 加 class="on" 或改 stroke 颜色 -->
</svg>
