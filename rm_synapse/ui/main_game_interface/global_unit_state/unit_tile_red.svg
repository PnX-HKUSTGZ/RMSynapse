<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f3236"/>
      <stop offset="100%" stop-color="#1a1c1f"/>
    </linearGradient>
    <linearGradient id="mini" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff8a7a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff4d4d" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b5b"/>
      <stop offset="100%" stop-color="#e3352f"/>
    </linearGradient>
    <linearGradient id="wedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6b5b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6b5b" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 左侧渐变角板 -->
  <path d="M14 26 L34 22 L44 86 L24 90 Z" fill="url(#wedge)" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- 主板 -->
  <path d="M30 20 L122 10 L142 82 L50 92 Z" fill="url(#bg)" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 右侧小板 -->
  <path d="M124 46 L160 40 L168 68 L132 74 Z" fill="url(#mini)" stroke="url(#edge)" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
