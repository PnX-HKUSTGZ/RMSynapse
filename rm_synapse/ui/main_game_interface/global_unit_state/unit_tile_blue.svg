<svg xmlns="http://www.w3.org/2000/svg" width="180" height="120" viewBox="0 0 180 120">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#30353a"/>
      <stop offset="100%" stop-color="#1a1e23"/>
    </linearGradient>
    <linearGradient id="miniB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c6b78"/>
      <stop offset="100%" stop-color="#2c3238"/>
    </linearGradient>
    <linearGradient id="edgeB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad2ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4aa8ff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="baseB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bc5ff"/>
      <stop offset="100%" stop-color="#2d95ff"/>
    </linearGradient>
    <linearGradient id="wedgeB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bc5ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6bc5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowB" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- 左侧渐变角板 -->
  <path d="M166 26 L146 22 L136 86 L156 90 Z" fill="url(#wedgeB)" stroke="url(#edgeB)" stroke-width="1.5"/>

  <!-- 主板 -->
  <path d="M150 20 L58 10 L38 82 L130 92 Z" fill="url(#bgB)" stroke="url(#edgeB)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 右侧小板 -->
  <path d="M56 46 L20 40 L12 68 L48 74 Z" fill="url(#miniB)" stroke="url(#edgeB)" stroke-width="1.8" stroke-linejoin="round"/>
</svg>
