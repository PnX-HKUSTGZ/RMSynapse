<svg xmlns="http://www.w3.org/2000/svg" width="160" height="20" viewBox="0 0 160 20">
  <defs>
    <linearGradient id="hpRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="100%" stop-color="#e3352f"/>
    </linearGradient>
    <linearGradient id="hpBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ad2ff"/>
      <stop offset="100%" stop-color="#2d95ff"/>
    </linearGradient>
  </defs>
  <!-- 背板 -->
  <rect x="1" y="1" width="158" height="18" rx="6" fill="#1f1f1f" stroke="#444" stroke-width="1.5"/>
  <!-- 前景条（默认红，可通过 modulate 或替换填充颜色） -->
  <rect id="fill" x="3" y="3" width="154" height="14" rx="5" fill="url(#hpRed)"/>
</svg>
