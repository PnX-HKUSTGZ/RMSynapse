<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2f33"/>
      <stop offset="100%" stop-color="#191b1f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7cf0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 背板六边形 -->
  <path d="M30 12 H190 L210 4 H210 210 L230 12 H390 C400 12 408 20 408 30 V90 C408 100 400 108 390 108 H30 C20 108 12 100 12 90 V30 C12 20 20 12 30 12 Z"
        fill="url(#bg)" stroke="#4f5860" stroke-width="2" stroke-linejoin="round"/>

  <!-- 内描边高光 -->
  <path d="M34 22 H190 L210 14 L230 22 H386 C392 22 396 26 396 32 V88 C396 94 392 98 386 98 H34 C28 98 24 94 24 88 V32 C24 26 28 22 34 22 Z"
        fill="none" stroke="#7cf0ff" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.8"/>

  <!-- 底部光带 -->
  <rect x="170" y="92" width="80" height="10" rx="5" fill="#7cf0ff" filter="url(#blur)" opacity="0.8"/>
  <rect x="180" y="94" width="60" height="6" rx="3" fill="url(#glow)"/>
</svg>
