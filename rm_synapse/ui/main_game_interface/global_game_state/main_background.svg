<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <defs>
    <linearGradient id="mainBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2f33"/>
      <stop offset="100%" stop-color="#191b1f"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cf0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7cf0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f5860" stop-opacity="0"/>
      <stop offset="40%" stop-color="#7cf0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7cf0ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#7cf0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f5860" stop-opacity="0"/>
    </linearGradient>
    <filter id="bgBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- 主背板六边形外形 -->
  <path d="M30 18 H170 L190 6 L210 2 L230 6 L250 18 H390 C400 18 408 26 408 36 V100 C408 110 400 118 390 118 H30 C20 118 12 110 12 100 V36 C12 26 20 18 30 18 Z"
        fill="url(#mainBg)" stroke="#4f5860" stroke-width="2" stroke-linejoin="round"/>

  <!-- 内描边高光 -->
  <path d="M36 26 H168 L188 14 L210 10 L232 14 L252 26 H384 C390 26 394 30 394 36 V96 C394 102 390 106 384 106 H36 C30 106 26 102 26 96 V36 C26 30 30 26 36 26 Z"
        fill="none" stroke="#7cf0ff" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.6"/>

  <!-- 顶部中心突起装饰 -->
  <path d="M185 6 L210 2 L235 6"
        fill="none" stroke="url(#topAccent)" stroke-width="2" stroke-linecap="round"/>

  <!-- 底部光带 -->
  <rect x="170" y="106" width="80" height="8" rx="4" fill="#7cf0ff" filter="url(#bgBlur)" opacity="0.6"/>
  <rect x="180" y="108" width="60" height="4" rx="2" fill="url(#edgeGlow)"/>

  <!-- 左右两侧装饰线 -->
  <line x1="20" y1="50" x2="20" y2="80" stroke="#7cf0ff" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="400" y1="50" x2="400" y2="80" stroke="#7cf0ff" stroke-width="1" stroke-opacity="0.3"/>
</svg>
