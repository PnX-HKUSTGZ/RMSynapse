<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f3438"/>
      <stop offset="100%" stop-color="#1b1e21"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cf0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7cf0ff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="inner" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#6bf3ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6bf3ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- 外形平行四边形 -->
  <path d="M12 10 L62 4 L70 56 L20 62 Z" fill="url(#bg)" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- 内部高光 -->
  <path d="M18 14 L58 9 L64 52 L24 57 Z" fill="url(#inner)" filter="url(#shadow)"/>
</svg>
